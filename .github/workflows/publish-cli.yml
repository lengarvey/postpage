name: Publish CLI

# Publishes the `postpage` npm package, only when a push to main touches the
# CLI and cli/package.json carries a version not yet on the registry.
#
# Auth is npm Trusted Publishing (OIDC): npmjs.com is configured to trust this
# repository + workflow file, so there is no NPM_TOKEN secret. Requires the
# `npm` GitHub environment (restrict it to the main branch in repo settings).
# Once the repository is public, npm attaches provenance automatically.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/publish-cli.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # Trusted publishing needs the job's OIDC grant. If this fails, GitHub
      # didn't issue one — check that the workflow-level `id-token: write`
      # permission survived and the `npm` environment allows this branch. If
      # it passes but publish still hits ENEEDAUTH, the mismatch is on
      # npmjs.com: the package's trusted publisher must name this repo,
      # workflow file `publish-cli.yml`, and environment `npm` exactly.
      - name: Assert OIDC token availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token request URL in the job environment — id-token: write was not granted."
            exit 1
          fi
          echo "OIDC grant present."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # Node 22 bundles npm 10; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test
        run: pnpm -C cli typecheck && pnpm -C cli test

      - name: Build
        run: pnpm -C cli build

      - name: Check whether this version is already published
        id: version
        working-directory: cli
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "postpage@${version}" version >/dev/null 2>&1; then
            echo "postpage@${version} is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        working-directory: cli
        run: npm publish --access public
