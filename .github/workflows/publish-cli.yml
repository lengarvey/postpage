name: Publish CLI

# Publishes the `postpage` npm package, only when a push to main touches the
# CLI and cli/package.json carries a version not yet on the registry.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/publish-cli.yml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# If the repository goes public, add `id-token: write` here, a matching
# `repository` field in cli/package.json, and `--provenance` on npm publish —
# provenance attestations are only supported for public source repos.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test
        run: pnpm -C cli typecheck && pnpm -C cli test

      - name: Build
        run: pnpm -C cli build

      - name: Check whether this version is already published
        id: version
        working-directory: cli
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "postpage@${version}" version >/dev/null 2>&1; then
            echo "postpage@${version} is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
